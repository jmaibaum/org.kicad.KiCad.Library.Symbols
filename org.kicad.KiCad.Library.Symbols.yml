id: org.kicad.KiCad.Library.Symbols
runtime: org.kicad.KiCad
runtime-version: stable
sdk: org.gnome.Sdk//50
build-extension: true
separate-locales: false
appstream-compose: false
build-options:
  prefix: /app/extensions/Library/Symbols
modules:
  - name: kicad-symbols
    buildsystem: cmake-ninja
    config-opts:
      - -DKICAD_DATA=/app/extensions/Library/Symbols
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo org.kicad.KiCad.Library.Symbols.metainfo.xml
    sources:
      - type: git
        url: https://gitlab.com/kicad/libraries/kicad-symbols.git
        commit: 60d2dc9981920ee40eb5caa4dc01b23f713beca7
        tag: 10.0.5
        x-checker-data:
          type: json
          url: https://gitlab.com/api/v4/projects/kicad%2Flibraries%2Fkicad-symbols/repository/tags
          tag-query: '[.[].name | select(match("^([\\d]+)\\.([\\d]+).*$"; "").captures
            | (.[0].string | tonumber == 10) and (.[1].string | tonumber < 99))] |
            first'
          version-query: $tag
          timestamp-query: .[] | select(.name == $tag).created_at
          is-main-source: true
      - type: file
        path: org.kicad.KiCad.Library.Symbols.metainfo.xml
